<!DOCTYPE html>
<html lang="en">
<head>
    <!-- :head-common-start: -->
    <!-- DO NOT EDIT page heads directly for these lines — edit this partial
         and run `python update_head.py` (or double-click update-head.bat) to
         propagate the changes to every *.html page in the project. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="author" content="grading-game">
    <meta name="robots" content="index, follow">

    <!-- Force HTTPS — runs before any other script so we never load the
         site over plain HTTP. Cloudflare Pages serves HTTPS by default,
         but if a user types `http://grading-game.com` or clicks an old
         link, Brave / Safari / Chrome paint a "Not secure" warning until
         we redirect. The hostname check skips localhost / 127.x for
         local development with `python -m http.server`. -->
    <script>
        (function () {
            if (location.protocol === 'http:'
                && location.hostname !== 'localhost'
                && !location.hostname.startsWith('127.')) {
                location.replace('https://' + location.host + location.pathname + location.search + location.hash);
            }
        })();
    </script>
    <!-- Upgrade any accidental http:// resource references to https:// so
         a stray hardcoded link can't downgrade the page to mixed content. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- Site-wide Open Graph + Twitter card defaults · per-page tags below override -->
    <meta property="og:site_name" content="grading-game">
    <meta property="og:type"      content="website">
    <meta property="og:locale"    content="en_US">
    <meta name="twitter:card"     content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css?v=8">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/grading-ui.css">

    <link rel="shortcut icon" type="image/x-icon" href="images/logo.png">

    <!-- Supabase client + global auth widget — loaded on every page so the
         "Sign in / Avatar" widget can mount in the top bar regardless of
         where the user lands. Order matters: SDK → gg client → auth UI.
         All deferred (none touch the DOM before DOMContentLoaded, each
         already guards on document.readyState) so they don't block the
         initial render — `defer` preserves this relative execution order. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-client.js?v=15" defer></script>
    <script src="js/auth-ui.js?v=9" defer></script>
    <script src="js/presence.js?v=4" defer></script>
    <!-- i18n must load BEFORE chrome.js so the language picker (and any
         data-i18n elements in the page) can be populated on first paint. -->
    <script src="js/i18n-dict.js?v=23" defer></script>
    <script src="js/i18n.js?v=2" defer></script>
    <script src="js/chrome.js?v=9" defer></script>
    <!-- :head-common-end: -->
    <title data-i18n="result.meta_title">result · grading-game</title>
    <meta name="description" content="Side-by-side or wipe-mode comparison of your grade with the reference. Available after a solo session.">
    <!-- Result page only makes sense after a session — relies on sessionStorage. -->
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="css/result.css?v=6">
    <link rel="stylesheet" href="css/mobile.css?v=5">
</head>
<body class="mobile-friendly">
    <script src="js/mobile-gate.js"></script>

    <header class="top-bar">
        <div class="brand">
            <a href="index.html" style="display:flex; align-items:center; gap:12px;">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 18 18" width="16" height="16">
                        <circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M 9 1 A 8 8 0 0 1 9 17 Z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand-name">grading<span class="brand-dot">-</span>game</span>
            </a>
        </div>
        <div class="top-bar-right">
            <div class="version-tag">
                <span>solo</span><span class="sep">·</span><span>result</span>
            </div>
        </div>
    </header>

    <main class="result-stage">

        <div class="result-header">
            <div>
                <div class="result-eyebrow" data-i18n="result.eyebrow">solo · session complete</div>
                <h1 class="result-title" id="result-title" data-i18n="result.h1">Comparison</h1>
            </div>
            <div class="result-meta" id="result-meta">
                <span><strong id="meta-challenge">—</strong> · <span data-i18n="solo.challenge">challenge</span></span>
                <span class="dot-sep">·</span>
                <span><strong id="meta-duration">—</strong> <span data-i18n="solo.sum_min">min</span></span>
                <span class="dot-sep">·</span>
                <span><strong id="meta-submitted">—</strong></span>
            </div>
        </div>

        <!-- View mode switcher -->
        <div class="view-switcher" role="tablist" aria-label="comparison view">
            <button class="view-btn is-active" data-view="side" role="tab" aria-selected="true">
                <span class="view-btn-icon" aria-hidden="true">⫷⫸</span>
                <span data-i18n="result.side_by_side">side by side</span>
            </button>
            <button class="view-btn" data-view="wipe" role="tab" aria-selected="false">
                <span class="view-btn-icon" aria-hidden="true">⇄</span>
                <span data-i18n="result.wipe">wipe</span>
            </button>
        </div>

        <!-- The two views — only one is visible at a time -->
        <div class="compare-views" data-active="side">

            <!-- Side-by-side view (your grade + reference) -->
            <div class="compare-grid cols-2" id="compare-grid" data-view="side">
                <!-- cells built by JS -->
            </div>

            <!-- Wipe view -->
            <div class="compare-wipe" id="compare-wipe" data-view="wipe">
                <div class="wipe-labels">
                    <span class="wipe-label-left" data-i18n="result.your_grade">your grade</span>
                    <span class="wipe-split-pct" id="wipe-pct">50%</span>
                    <span class="wipe-label-right" data-i18n="result.reference">reference</span>
                </div>
                <!-- wipe-stage centers an aspect-locked container in the
                     available vertical space, so the divider matches the
                     actual image bounds instead of overflowing into letterbox. -->
                <div class="wipe-stage">
                    <div class="wipe-container" id="wipe-container">
                        <img id="wipe-img-right" class="wipe-img wipe-img--right" alt="reference grade">
                        <img id="wipe-img-left"  class="wipe-img wipe-img--left"  alt="your grade">
                        <div class="wipe-divider" id="wipe-divider">
                            <div class="wipe-handle" aria-label="drag to compare">
                                <span aria-hidden="true">⇄</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ============ COMMUNITY WALL ============
             Every edit ever published on this photo. Gated server-side:
             the feed only unlocks once YOUR grade is on it (publish-to-
             view, Wordle-style). Anonymous players get a teaser + a
             sign-in CTA. Logic in result.js, data via gg.getWall(). -->
        <section class="wall-section" id="wall-section" hidden>
            <div class="wall-head">
                <h2 class="wall-title" data-i18n="wall.title">The community wall</h2>
                <p class="wall-sub" id="wall-sub"></p>
            </div>

            <!-- Locked state: blurred placeholders + CTA -->
            <div class="wall-locked" id="wall-locked" hidden>
                <div class="wall-locked-preview" aria-hidden="true">
                    <div class="wall-ph"></div>
                    <div class="wall-ph"></div>
                    <div class="wall-ph"></div>
                </div>
                <button class="wall-cta" id="wall-cta" type="button"></button>
                <div class="wall-hint" id="wall-hint"></div>
            </div>

            <!-- Open state: the grid (filled by result.js) -->
            <div class="wall-grid" id="wall-grid" hidden></div>
            <div class="wall-actions" id="wall-actions" hidden>
                <button class="wall-update-btn" id="wall-update-btn" type="button" data-i18n="wall.update_btn">↻ replace my edit with this session's</button>
            </div>
        </section>

        <div class="result-footer">
            <a href="index.html" class="back-link" data-i18n="back.menu">← back to menu</a>
            <div class="result-actions">
                <button class="result-action" id="download-grade" data-i18n="result.download_grade">⤓ download my grade</button>
                <button class="result-action is-primary" id="new-session" data-i18n="result.new_session">↻ new session</button>
            </div>
        </div>

    </main>

    <div class="vignette-overlay" aria-hidden="true"></div>
    <div class="grain-overlay"    aria-hidden="true"></div>

    <script src="js/file-io.js" defer></script>
    <script src="js/result.js?v=3" defer></script>
</body>
</html>
