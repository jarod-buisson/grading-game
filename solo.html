<!DOCTYPE html>
<html lang="en">
<head>
    <!-- :head-common-start: -->
    <!-- DO NOT EDIT page heads directly for these lines — edit this partial
         and run `python update_head.py` (or double-click update-head.bat) to
         propagate the changes to every *.html page in the project. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="author" content="grading-game">
    <meta name="robots" content="index, follow">

    <!-- Site-wide Open Graph + Twitter card defaults · per-page tags below override -->
    <meta property="og:site_name" content="grading-game">
    <meta property="og:type"      content="website">
    <meta property="og:locale"    content="en_US">
    <meta name="twitter:card"     content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css?v=7">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/grading-ui.css">

    <link rel="shortcut icon" type="image/x-icon" href="images/logo.png">

    <!-- Supabase client + global auth widget — loaded on every page so the
         "Sign in / Avatar" widget can mount in the top bar regardless of
         where the user lands. Order matters: SDK → gg client → auth UI. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=9"></script>
    <script src="js/auth-ui.js?v=4"></script>
    <script src="js/presence.js?v=2"></script>
    <!-- :head-common-end: -->
    <title>solo training · grading-game</title>
    <meta name="description" content="Solo training mode: practice color grading on real RAW files with a reference grade for comparison. No score, no opponents — just you and the photo.">

    <link rel="canonical"            href="https://grading-game.com/solo.html">
    <meta property="og:url"          content="https://grading-game.com/solo.html">
    <meta property="og:title"        content="Solo training · grading-game">
    <meta property="og:description"  content="Practice color grading on real RAW files with a reference grade for comparison.">
    <meta property="og:image"        content="https://grading-game.com/images/og-image.jpg">
    <meta name="twitter:title"       content="Solo training · grading-game">
    <meta name="twitter:description" content="Practice color grading on real RAW files with a reference grade for comparison.">
    <meta name="twitter:image"       content="https://grading-game.com/images/og-image.jpg">
    <link rel="stylesheet" href="css/setup.css?v=3">
</head>
<body>
    <script src="js/mobile-gate.js"></script>

    <!-- =================== TOP BAR =================== -->
    <header class="top-bar">
        <div class="brand">
            <a href="index.html" style="display:flex; align-items:center; gap:12px;">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 18 18" width="16" height="16">
                        <circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M 9 1 A 8 8 0 0 1 9 17 Z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand-name">grading<span class="brand-dot">-</span>game</span>
            </a>
        </div>
        <div class="top-bar-right">
            <div class="version-tag">
                <span>solo</span><span class="sep">·</span><span>session setup</span>
            </div>
        </div>
    </header>

    <!-- =================== MAIN — setup =================== -->
    <main class="setup-stage">

        <div class="setup-eyebrow">01 · solo</div>
        <h1 class="setup-title">session profile</h1>

        <div class="setup-grid setup-grid--single">

            <!-- Controls (full width — tone curve has moved to landing) -->
            <div class="setup-controls">

                <!-- DURATION -->
                <div class="control-block">
                    <div class="control-label">duration</div>
                    <div class="duration-display">
                        <span id="dur-min">20</span><span class="colon">:</span><span id="dur-sec">00</span>
                        <span class="unit">min</span>
                    </div>
                    <div class="duration-track" id="dur-track">
                        <button class="dur-tick" data-min="5">
                            <span class="dur-tick-label">05</span>
                        </button>
                        <button class="dur-tick" data-min="10">
                            <span class="dur-tick-label">10</span>
                        </button>
                        <button class="dur-tick" data-min="15">
                            <span class="dur-tick-label">15</span>
                        </button>
                        <button class="dur-tick is-active" data-min="20">
                            <span class="dur-tick-label">20</span>
                        </button>
                        <button class="dur-tick" data-min="30">
                            <span class="dur-tick-label">30</span>
                        </button>
                        <button class="dur-tick" data-min="45">
                            <span class="dur-tick-label">45</span>
                        </button>
                        <button class="dur-tick" data-min="60">
                            <span class="dur-tick-label">60</span>
                        </button>
                    </div>
                </div>

                <!-- CHALLENGE -->
                <div class="control-block">
                    <div class="control-label">challenge</div>
                    <select class="challenge-select" id="challenge-select">
                        <option value="random">random pick · all categories</option>
                        <!-- options populated by solo-setup.js -->
                    </select>
                    <div class="challenge-hint" id="challenge-hint">
                        sign in to unlock photos by playing &amp; replay them here
                    </div>
                </div>

                <!-- REFERENCE -->
                <div class="control-block">
                    <div class="control-label">reference grade</div>
                    <label class="toggle">
                        <input type="checkbox" id="ref-toggle" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">show admin's reference after submission</span>
                    </label>
                </div>

                <!-- START -->
                <button class="btn-start" id="start-btn">
                    <span>start session</span>
                    <span class="btn-arrow">→</span>
                </button>

            </div>
        </div>

        <!-- Bottom row -->
        <div class="setup-footer">
            <a href="index.html" class="back-link">← back to menu</a>
            <div class="setup-summary">
                <span><strong id="sum-dur">20</strong> min</span>
                <span class="dot-sep">·</span>
                <span>challenge <strong>random</strong></span>
                <span class="dot-sep">·</span>
                <span>reference <strong id="sum-ref">on</strong></span>
            </div>
        </div>

    </main>

    <div class="vignette-overlay" aria-hidden="true"></div>
    <div class="grain-overlay"    aria-hidden="true"></div>

    <script src="js/solo-setup.js?v=3"></script>
    <script src="js/audio-player.js?v=4"></script>
</body>
</html>
