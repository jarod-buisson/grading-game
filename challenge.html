<!DOCTYPE html>
<html lang="en">
<head>
    <!-- :head-common-start: -->
    <!-- DO NOT EDIT page heads directly for these lines — edit this partial
         and run `python update_head.py` (or double-click update-head.bat) to
         propagate the changes to every *.html page in the project. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="author" content="grading-game">
    <meta name="robots" content="index, follow">

    <!-- Force HTTPS — runs before any other script so we never load the
         site over plain HTTP. Cloudflare Pages serves HTTPS by default,
         but if a user types `http://grading-game.com` or clicks an old
         link, Brave / Safari / Chrome paint a "Not secure" warning until
         we redirect. The hostname check skips localhost / 127.x for
         local development with `python -m http.server`. -->
    <script>
        (function () {
            if (location.protocol === 'http:'
                && location.hostname !== 'localhost'
                && !location.hostname.startsWith('127.')) {
                location.replace('https://' + location.host + location.pathname + location.search + location.hash);
            }
        })();
    </script>
    <!-- Upgrade any accidental http:// resource references to https:// so
         a stray hardcoded link can't downgrade the page to mixed content. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- Site-wide Open Graph + Twitter card defaults · per-page tags below override -->
    <meta property="og:site_name" content="grading-game">
    <meta property="og:type"      content="website">
    <meta property="og:locale"    content="en_US">
    <meta name="twitter:card"     content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/theme.css?v=8">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/grading-ui.css">

    <link rel="shortcut icon" type="image/x-icon" href="images/logo.png">

    <!-- Supabase client + global auth widget — loaded on every page so the
         "Sign in / Avatar" widget can mount in the top bar regardless of
         where the user lands. Order matters: SDK → gg client → auth UI.
         All deferred (none touch the DOM before DOMContentLoaded, each
         already guards on document.readyState) so they don't block the
         initial render — `defer` preserves this relative execution order. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-client.js?v=15" defer></script>
    <script src="js/auth-ui.js?v=9" defer></script>
    <script src="js/presence.js?v=4" defer></script>
    <!-- i18n must load BEFORE chrome.js so the language picker (and any
         data-i18n elements in the page) can be populated on first paint. -->
    <script src="js/i18n-dict.js?v=23" defer></script>
    <script src="js/i18n.js?v=2" defer></script>
    <script src="js/chrome.js?v=9" defer></script>
    <!-- :head-common-end: -->
    <title data-i18n="challenge.meta_title">community wall · grading-game</title>
    <meta name="description" content="See how the community edited this photo — the original reference grade plus every player's published edit, side by side.">
    <!-- Per-photo wall depends on what the signed-in user has unlocked; no
         stable shareable content → keep it out of the index. -->
    <meta name="robots" content="noindex, follow">

    <link rel="stylesheet" href="css/challenge.css?v=2">
    <link rel="stylesheet" href="css/mobile.css?v=5">
</head>
<body class="mobile-friendly">
    <script src="js/mobile-gate.js"></script>

    <header class="top-bar">
        <div class="brand">
            <a href="index.html" style="display:flex; align-items:center; gap:12px;">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 18 18" width="16" height="16">
                        <circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M 9 1 A 8 8 0 0 1 9 17 Z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand-name">grading<span class="brand-dot">-</span>game</span>
            </a>
        </div>
        <div class="top-bar-right">
            <div class="version-tag">
                <span>03</span><span class="sep">·</span><span data-i18n="wall.title">the community wall</span>
            </div>
        </div>
    </header>

    <main class="cw-stage">
        <div class="cw-inner">

            <div>
                <div class="cw-eyebrow">
                    <span data-i18n="challenge.eyebrow">challenge</span>
                    <span id="cw-id">—</span>
                </div>
                <h1 class="cw-title" data-i18n="challenge.h1">Every edit of this photo</h1>
            </div>

            <p class="cw-credit" id="cw-credit" hidden></p>
            <p class="cw-sub" id="cw-sub"></p>

            <!-- Comparator toolbar: revealed once the wall is open -->
            <div class="cw-toolbar" id="cw-toolbar" hidden>
                <button class="cw-compare-toggle" id="cw-compare-toggle" type="button" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3 5h8v14H3V5zm10 0h8v14h-8V5z"/></svg>
                    <span data-i18n="challenge.open_comparator">open the comparator</span>
                </button>
            </div>

            <!-- The comparator: two slots (A / B). Fill each by dragging a
                 thumbnail onto it, picking from its list, or tapping a card.
                 Two views: side by side, and a wipe slider overlay. -->
            <section class="cw-comparator" id="cw-comparator" hidden>
                <div class="cw-cmp-head">
                    <div class="cw-cmp-modes" role="tablist" aria-label="comparison view">
                        <button class="cw-mode-btn is-active" type="button" data-mode="side" data-i18n="result.side_by_side">side by side</button>
                        <button class="cw-mode-btn" type="button" data-mode="wipe" data-i18n="result.wipe">wipe</button>
                    </div>
                    <button class="cw-cmp-close" id="cw-cmp-close" type="button" aria-label="close comparator">✕</button>
                </div>

                <div class="cw-cmp-pickers">
                    <label class="cw-picker">
                        <span class="cw-picker-tag cw-picker-tag--a">A</span>
                        <select class="cw-slot-select" id="cw-select-a"></select>
                    </label>
                    <label class="cw-picker">
                        <span class="cw-picker-tag cw-picker-tag--b">B</span>
                        <select class="cw-slot-select" id="cw-select-b"></select>
                    </label>
                </div>

                <div class="cw-cmp-stage" id="cw-cmp-stage" data-mode="side">
                    <!-- Side-by-side -->
                    <div class="cw-cmp-side" data-view="side">
                        <div class="cw-slot" id="cw-slot-a" data-slot="a">
                            <div class="cw-slot-frame" id="cw-frame-a"></div>
                            <div class="cw-slot-name"><span class="cw-slot-tag cw-slot-tag--a">A</span><span id="cw-name-a"></span></div>
                        </div>
                        <div class="cw-slot" id="cw-slot-b" data-slot="b">
                            <div class="cw-slot-frame" id="cw-frame-b"></div>
                            <div class="cw-slot-name"><span class="cw-slot-tag cw-slot-tag--b">B</span><span id="cw-name-b"></span></div>
                        </div>
                    </div>
                    <!-- Wipe slider -->
                    <div class="cw-cmp-wipe" data-view="wipe">
                        <div class="cw-wipe-labels">
                            <span class="cw-wipe-label-left" id="cw-wipe-name-a"></span>
                            <span class="cw-wipe-pct" id="cw-wipe-pct">50%</span>
                            <span class="cw-wipe-label-right" id="cw-wipe-name-b"></span>
                        </div>
                        <div class="cw-wipe-stage">
                            <div class="cw-wipe-container" id="cw-wipe-container">
                                <img id="cw-wipe-b" class="cw-wipe-img cw-wipe-img--b" alt="">
                                <img id="cw-wipe-a" class="cw-wipe-img cw-wipe-img--a" alt="">
                                <div class="cw-wipe-divider" id="cw-wipe-divider">
                                    <div class="cw-wipe-handle" aria-hidden="true"><span>⇄</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="cw-cmp-hint" data-i18n="challenge.comparator_hint">
                    Drag a thumbnail onto A or B — or pick from the lists. Tap a card to fill the next slot.
                </p>
            </section>

            <!-- Locked / not-unlocked state: you haven't played this photo,
                 or you're browsing anonymously. CTA sends you to play it. -->
            <div class="cw-locked" id="cw-locked" hidden>
                <div class="cw-locked-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
                </div>
                <p class="cw-locked-text" id="cw-locked-text" data-i18n="challenge.locked">
                    Unlock this photo by editing it first, then come back to see everyone’s take.
                </p>
                <a class="cw-locked-cta" id="cw-locked-cta" href="solo.html">
                    <span data-i18n="challenge.locked_cta">edit this photo</span>
                    <span aria-hidden="true">→</span>
                </a>
            </div>

            <!-- The grid: original (reference) first, then every published edit -->
            <div class="wall-grid" id="cw-grid" hidden></div>

            <a href="gallery.html" class="back-link" data-i18n="challenge.back">← back to gallery</a>

        </div>
    </main>

    <div class="vignette-overlay" aria-hidden="true"></div>
    <div class="grain-overlay"    aria-hidden="true"></div>

    <script src="js/challenge.js?v=2"></script>
</body>
</html>
